<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      padding: 0;
      margin: 0;
    }
    .container {
      background-color: #ffffff;
      max-width: 600px;
      margin: 40px auto;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .header {
      text-align: center;
      padding-bottom: 20px;
    }
    .header img {
      max-height: 60px;
    }
    .content {
      color: #333;
      font-size: 16px;
      line-height: 1.6;
    }
    .highlight {
      font-weight: bold;
      color: #005b96;
    }
    .section {
      margin-top: 20px;
    }
    .message-box {
      background-color: #f0f8ff;
      border-left: 4px solid #007acc;
      padding: 15px;
      font-style: italic;
    }
    .footer {
      margin-top: 30px;
      font-size: 14px;
      color: #777;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="./systempus.png" alt="Logo Systempus" />
    </div>

    <div class="content">
      <p>
        Prezado(a) usuário(a),
      </p>

      <p>
        Recebemos uma solicitação para redefinir sua senha. Para continuar, clique no link abaixo. Este link é válido por tempo limitado:
      </p>

      <p class="highlight">
        <a href="{{link}}" target="_blank">{{link}}</a>
      </p>

      <p>
        Se você não solicitou a redefinição de senha, por favor, ignore esta mensagem.
      </p>

      <div class="footer">
        <p>Atenciosamente,<br><strong>Equipe Systempus</strong></p>
      </div>
    </div>
  </div>
</body>
</html>
